<rect x="0.5" y="0.5" width="839" height="264" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="26" class="title">Easy to undo</text>
<g class="s6"><text x="18" y="53" class="who">You</text><rect x="16" y="58" width="344" height="133.0" rx="10" fill="#ddf4ff" stroke="#b6e3ff"/><text y="80.6"><tspan x="27.0">To store each user's preferred time zone, I want to</tspan></text><text y="100.1"><tspan x="27.0">add a nullable timezone text column to the users</tspan></text><text y="119.6"><tspan x="27.0">table in our production Postgres 15 database. If we</tspan></text><text y="139.1"><tspan x="27.0">change our minds, dropping the column is another</tspan></text><text y="158.6"><tspan x="27.0">one-line migration. Anything that should stop me</tspan></text><text y="178.1"><tspan x="27.0">running it at 10:00?</tspan></text><clipPath id="k0"><rect x="17" y="59" width="342" height="131.0" rx="9"/></clipPath><g clip-path="url(#k0)"><rect x="25" y="66.0" width="324.3" height="19.5" fill="#ddf4ff" class="t0"/><rect x="25" y="85.5" width="312.1" height="19.5" fill="#ddf4ff" class="t1"/><rect x="25" y="105.0" width="327.9" height="19.5" fill="#ddf4ff" class="t2"/><rect x="25" y="124.5" width="323.2" height="19.5" fill="#ddf4ff" class="t3"/><rect x="25" y="144.0" width="311.3" height="19.5" fill="#ddf4ff" class="t4"/><rect x="25" y="163.5" width="129.4" height="19.5" fill="#ddf4ff" class="t5"/></g></g><g class="s7"><text x="376" y="53" class="who">jamais-vu</text><clipPath id="a"><rect x="374" y="58" width="450" height="191.0" rx="10"/></clipPath><rect x="374" y="58" width="450" height="191.0" rx="10" fill="#ffffff" stroke="#d0d7de"/><rect x="374" y="58" width="5" height="191.0" fill="#1a7f37" clip-path="url(#a)"/></g><g class="s7"><text y="84.6"><tspan x="390.0" class="bold">jamais-vu check</tspan><tspan x="497.8" class="muted">·</tspan><tspan x="504.7" class="twoway">two-way door</tspan><tspan x="591.7">: metadata-only add on</tspan></text><text y="104.1"><tspan x="404.0">Postgres 15; drop is one line, failure shows instantly.</tspan></text></g><g class="s8"><text y="141.9"><tspan x="390.0" class="go">Go.</tspan></text></g><g class="s9"><text y="173.6"><tspan x="390.0" class="door">Door closes if:</tspan><tspan x="487.5">a default, backfill or reader ships against</tspan></text><text y="193.1"><tspan x="404.0">the column — check again then.</tspan></text></g><g class="s10"><text y="212.6"><tspan x="390.0" class="watch">Watch:</tspan><tspan x="438.7">queries piling up behind the ALTER's lock in</tspan></text><text y="232.1"><tspan x="404.0">pg_stat_activity within seconds of starting.</tspan></text></g>
</svg>
