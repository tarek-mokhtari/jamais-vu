@keyframes s9{0%,30.383%{opacity:0}32.679%,96.199%{opacity:1}98.495%,100%{opacity:0}}.s9{animation:s9 13.07s linear infinite}
@keyframes s10{0%,32.679%{opacity:0}34.974%,96.199%{opacity:1}98.495%,100%{opacity:0}}.s10{animation:s10 13.07s linear infinite}
