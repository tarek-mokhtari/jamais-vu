<svg xmlns="http://www.w3.org/2000/svg" width="840" height="265" viewBox="0 0 840 265" role="img" aria-label="jamais-vu demo: easy to undo">
<style><![CDATA[
text{font-family:Helvetica, Arial, 'Liberation Sans', sans-serif;font-size:13.5px;fill:#1f2328}.text{font-size:13.5px;fill:#1f2328}.mark{font-size:13.5px;fill:#1f2328}.bold{font-size:13.5px;font-weight:700;fill:#1f2328}.muted{font-size:12.5px;fill:#59636e}.code{font-family:Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;font-size:12.5px;fill:#1f2328}.cite{font-size:13.5px;fill:#0969da}.quote{font-size:13.5px;fill:#0969da}.oneway{font-size:13.5px;font-weight:700;fill:#d1242f}.twoway{font-size:13.5px;font-weight:700;fill:#1a7f37}.go{font-size:22px;font-weight:700;fill:#1a7f37}.test{font-size:13.5px;font-weight:700;fill:#1a7f37}.risk{font-size:13.5px;font-weight:700;fill:#bc4c00}.trip{font-size:13.5px;font-weight:700;fill:#8250df}.door{font-size:13.5px;font-weight:700;fill:#9a6700}.watch{font-size:13.5px;font-weight:700;fill:#8250df}.who{font-size:11.5px;font-weight:700;fill:#59636e}.title{font-size:12.5px;fill:#59636e}
@keyframes t0{0%,4.974%{transform:translateX(0);animation-timing-function:steps(51,end)}8.189%,100%{transform:translateX(324.3px)}}.t0{transform:translateX(324.3px);animation:t0 13.07s linear infinite}
@keyframes t1{0%,8.189%{transform:translateX(0);animation-timing-function:steps(48,end)}11.327%,100%{transform:translateX(312.1px)}}.t1{transform:translateX(312.1px);animation:t1 13.07s linear infinite}
@keyframes t2{0%,11.327%{transform:translateX(0);animation-timing-function:steps(51,end)}14.541%,100%{transform:translateX(327.9px)}}.t2{transform:translateX(327.9px);animation:t2 13.07s linear infinite}
@keyframes t3{0%,14.541%{transform:translateX(0);animation-timing-function:steps(48,end)}17.602%,100%{transform:translateX(323.2px)}}.t3{transform:translateX(323.2px);animation:t3 13.07s linear infinite}
@keyframes t4{0%,17.602%{transform:translateX(0);animation-timing-function:steps(48,end)}20.663%,100%{transform:translateX(311.3px)}}.t4{transform:translateX(311.3px);animation:t4 13.07s linear infinite}
@keyframes t5{0%,20.663%{transform:translateX(0);animation-timing-function:steps(20,end)}21.964%,100%{transform:translateX(129.4px)}}.t5{transform:translateX(129.4px);animation:t5 13.07s linear infinite}
@keyframes s6{0%,3.061%{opacity:0}5.357%,96.199%{opacity:1}98.495%,100%{opacity:0}}.s6{animation:s6 13.07s linear infinite}
