<rect x="0.5" y="0.5" width="839" height="431" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="18" y="26" class="title">Hard to undo</text>
<g class="s9"><text x="18" y="53" class="who">You</text><rect x="16" y="58" width="344" height="152.5" rx="10" fill="#ddf4ff" stroke="#b6e3ff"/><g class="s16"><rect x="176.6" y="165.6" width="161.6" height="17" rx="3" fill="#ffeb99"/><rect x="25.0" y="185.1" width="138.3" height="17" rx="3" fill="#ffeb99"/></g><text y="80.6"><tspan x="27.0">It's 23:00 and I've been on this incident since 18:00.</tspan></text><text y="100.1"><tspan x="27.0">pg_basebackup has failed twice, apparently on</tspan></text><text y="119.6"><tspan x="27.0">connection limits, so I'll raise max_wal_senders,</tspan></text><text y="139.1"><tspan x="27.0">clear the data directory again and retry. I have a</tspan></text><text y="158.6"><tspan x="27.0">terminal open on each machine; their prompts differ</tspan></text><text y="178.1"><tspan x="27.0">only by the host number.</tspan><tspan x="178.6">The other on-call engineer</tspan></text><text y="197.6"><tspan x="27.0">signed off an hour ago</tspan><tspan x="161.3">. Quick check before I run it?</tspan></text><clipPath id="k0"><rect x="17" y="59" width="342" height="150.5" rx="9"/></clipPath><g clip-path="url(#k0)"><rect x="25" y="66.0" width="332.6" height="19.5" fill="#ddf4ff" class="t0"/><rect x="25" y="85.5" width="302.7" height="19.5" fill="#ddf4ff" class="t1"/><rect x="25" y="105.0" width="309.3" height="19.5" fill="#ddf4ff" class="t2"/><rect x="25" y="124.5" width="309.0" height="19.5" fill="#ddf4ff" class="t3"/><rect x="25" y="144.0" width="331.8" height="19.5" fill="#ddf4ff" class="t4"/><rect x="25" y="163.5" width="332.6" height="19.5" fill="#ddf4ff" class="t5"/><rect x="25" y="183.0" width="329.5" height="19.5" fill="#ddf4ff" class="t6"/></g></g><g class="s10"><text x="18" y="233.5" class="who">jamais-vu</text><rect x="16" y="238.5" width="344" height="94.0" rx="10" fill="#ffffff" stroke="#d0d7de"/><text y="261.1"><tspan x="27.0">Before I look for holes:</tspan></text><text y="280.6"><tspan x="27.0" class="bold">(1)</tspan></text><text y="280.6"><tspan x="47.0">what probability (0–100 %) do you give this of</tspan></text><text y="300.1"><tspan x="47.0">working as intended, and by what date?</tspan></text><text y="319.6"><tspan x="27.0" class="bold">(2)</tspan></text><text y="319.6"><tspan x="47.0">What is the most likely reason it fails?</tspan></text></g><g class="s11"><text x="18" y="355.5" class="who">You</text><rect x="16" y="360.5" width="344" height="55.0" rx="10" fill="#ddf4ff" stroke="#b6e3ff"/><text y="383.1"><tspan x="27.0">90% by 2026-12-01 — likely failure: pg_basebackup</tspan></text><text y="402.6"><tspan x="27.0">fails a third time and I hand over a half-done resync</tspan></text><clipPath id="k2"><rect x="17" y="361.5" width="342" height="53.0" rx="9"/></clipPath><g clip-path="url(#k2)"><rect x="25" y="368.5" width="335.8" height="19.5" fill="#ddf4ff" class="t7"/><rect x="25" y="388.0" width="330.2" height="19.5" fill="#ddf4ff" class="t8"/></g></g><g class="s12"><text x="376" y="53" class="who">jamais-vu</text><clipPath id="a"><rect x="374" y="58" width="450" height="327.0" rx="10"/></clipPath><rect x="374" y="58" width="450" height="327.0" rx="10" fill="#ffffff" stroke="#d0d7de"/><rect x="374" y="58" width="5" height="327.0" fill="#d1242f" clip-path="url(#a)"/></g><g class="s12"><text y="84.6"><tspan x="390.0" class="bold">jamais-vu check</tspan><tspan x="497.8" class="muted">·</tspan><tspan x="504.7" class="oneway">one-way</tspan><tspan x="558.7">: wiping a data directory by hand can't</tspan></text><text y="104.1"><tspan x="404.0">be undone, and the primary's backups have never been restored.</tspan></text></g><g class="s13"><text y="123.2"><tspan x="390.0" class="muted">consulted: ledger (L2, L1) · taxonomy · packs: software-infra</tspan></text></g><g class="s14"><rect x="404.0" y="161.6" width="201.6" height="15" rx="3" fill="#eff1f3"/><rect x="582.9" y="200.6" width="13.5" height="15" rx="3" fill="#eff1f3"/><text y="153.1"><tspan x="390.0" class="test">Cheapest test:</tspan><tspan x="486.8">On each terminal, print hostname and</tspan></text><text y="172.6"><tspan x="407.0" class="code">SELECT pg_is_in_recovery()</tspan><tspan x="605.6">, and read the exact</tspan></text><text y="192.1"><tspan x="404.0">pg_basebackup error and primary log · 3 min · stop if the host</tspan></text><text y="211.6"><tspan x="404.0">you're about to empty returns</tspan><tspan x="585.9" class="code">f</tspan><tspan x="596.4">, or the error isn't a sender limit.</tspan></text></g><g class="s15"><text y="241.1"><tspan x="390.0" class="risk">Risks:</tspan></text></g><g class="s16"><rect x="452.6" y="248.1" width="295.2" height="17" rx="3" fill="#ffeb99"/><text y="260.6"><tspan x="390.0" class="risk">1.</tspan></text><text y="260.6"><tspan x="410.0" class="cite">[L2 ← "</tspan><tspan x="454.6" class="quote">the other on-call engineer signed off an hour ago</tspan><tspan x="745.7" class="cite">"]</tspan><tspan x="758.0">You</tspan></text><text y="280.1"><tspan x="410.0">wiped the data directory at 23:00, five hours in, alone, with</tspan></text><text y="299.6"><tspan x="410.0">prompts differing only by host number. It ran on the primary.</tspan></text></g><g class="s17"><text y="329.1"><tspan x="390.0" class="trip">Tripwires:</tspan></text></g><g class="s18"><rect x="479.0" y="337.6" width="21.0" height="15" rx="3" fill="#eff1f3"/><rect x="603.6" y="337.6" width="149.0" height="15" rx="3" fill="#eff1f3"/><rect x="410.0" y="357.1" width="13.5" height="15" rx="3" fill="#eff1f3"/><text y="348.6"><tspan x="390.0" class="trip">•</tspan></text><text y="348.6"><tspan x="410.0">Before any</tspan><tspan x="482.0" class="code">rm</tspan><tspan x="503.8">or empty step, if</tspan><tspan x="606.6" class="code">pg_is_in_recovery()</tspan><tspan x="756.4">isn't</tspan></text><text y="368.1"><tspan x="413.0" class="code">t</tspan><tspan x="427.3">on that host, then stop and don't run it.</tspan></text></g>
</svg>
